 <title id="stage-timing-mobile-title">Stage Timing</title><desc id="stage-timing-mobile-description">Our two-stage solver runtime on eight CMU MoCap sequences. Stacked segments show rotation recovery and shape recovery in seconds, and labels at the bar ends show total time. Linear axis starts at zero. Supplementary material Table 14, page 8. Drink: 8.51 plus 6.45 equals 14.96 seconds for 1,102 frames.</desc><metadata>
